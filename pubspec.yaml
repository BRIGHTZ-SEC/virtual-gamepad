name: vgamepad
description: Turn your phone into a wireless Xbox-compatible gamepad for PC.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.2.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_master.png"
  min_sdk_android: 21
