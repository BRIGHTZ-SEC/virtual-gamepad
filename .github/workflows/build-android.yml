name: Build Android APK (Debug)

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Scaffold native android/ project
        run: flutter create --platforms=android --org in.atomprod .

      - name: Apply our AndroidManifest (permissions + orientation)
        run: cp manifest-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: flutter build apk --debug --build-number=1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-gamepad-debug
          path: android-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error